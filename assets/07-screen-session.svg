<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 866" role="img" aria-labelledby="title desc">
<title id="title">Disconnect the display, keep the session</title>
<desc id="desc">Three panels show one server-side Screen session. First the laptop attaches over SSH and Pi works on a task. Next the student detaches and disconnects the laptop; Pi keeps running on the development server. Finally the student reconnects and reattaches to the same session to inspect progress or the result. The LXC and model connection must stay available.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563a5" stroke-width="1.6"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7950a7" stroke-width="1.6"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#237d70" stroke-width="1.6"/></marker>
</defs>
<rect width="1200" height="866" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="600" y="48" font-size="31" fill="#172033" font-weight="700" text-anchor="middle">Disconnect the display, keep the session</text>
<text x="600" y="83" font-size="20" fill="#526177" font-weight="400" text-anchor="middle">One Screen session and one Pi process, seen at three different moments.</text>
<rect x="40" y="115" width="340" height="647" rx="12" fill="#f8fafc" stroke="#c8d4e3"/>
<text x="64" y="156" font-size="23" fill="#237d70" font-weight="700" text-anchor="start">01</text>
<text x="108" y="156" font-size="25" fill="#172033" font-weight="700" text-anchor="start">Attached</text>
<rect x="60" y="180" width="300" height="100" rx="12" fill="#eaf4ff" stroke="#2563a5"/>
<text x="210" y="219" font-size="21" fill="#2563a5" font-weight="700" text-anchor="middle">Laptop connected</text>
<text x="210" y="252" font-size="19" fill="#526177" font-weight="400" text-anchor="middle">Interact with Pi</text>
<path d="M210 283 L210 389" fill="none" stroke="#2563a5" stroke-width="2" marker-end="url(#blue)"/>
<text x="229" y="342" font-size="18" fill="#2563a5" font-weight="700" text-anchor="start">SSH</text>
<rect x="60" y="398" width="300" height="236" rx="12" fill="#e8f4ef" stroke="#237d70"/>
<text x="210" y="432" font-size="22" fill="#237d70" font-weight="700" text-anchor="middle">Development LXC</text>
<rect x="78" y="454" width="264" height="153" rx="12" fill="#ffffff" stroke="#237d70"/>
<text x="210" y="483" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">Screen: game-agent</text>
<rect x="95" y="500" width="230" height="84" rx="12" fill="#eaf4ff" stroke="#2563a5"/>
<text x="210" y="533" font-size="22" fill="#2563a5" font-weight="700" text-anchor="middle">Pi process</text>
<text x="210" y="564" font-size="19" fill="#2563a5" font-weight="400" text-anchor="middle">Working on the task</text>
<text x="210" y="683" font-size="20" fill="#2563a5" font-weight="700" text-anchor="middle">screen -S game-agent</text>
<text x="210" y="724" font-size="17" fill="#526177" font-weight="400" text-anchor="middle">Create the session, then start Pi.</text>
<rect x="430" y="115" width="340" height="647" rx="12" fill="#f8fafc" stroke="#c8d4e3"/>
<text x="454" y="156" font-size="23" fill="#237d70" font-weight="700" text-anchor="start">02</text>
<text x="498" y="156" font-size="25" fill="#172033" font-weight="700" text-anchor="start">Detached</text>
<rect x="450" y="180" width="300" height="100" rx="12" fill="#fff3dd" stroke="#996017"/>
<text x="600" y="219" font-size="21" fill="#996017" font-weight="700" text-anchor="middle">Laptop disconnected</text>
<text x="600" y="252" font-size="19" fill="#526177" font-weight="400" text-anchor="middle">Or switched off</text>
<path d="M600 283 L600 320" fill="none" stroke="#996017" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M600 354 L600 389" fill="none" stroke="#996017" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M589 328 L611 349" fill="none" stroke="#996017" stroke-width="2"/>
<path d="M611 328 L589 349" fill="none" stroke="#996017" stroke-width="2"/>
<text x="625" y="344" font-size="17" fill="#996017" font-weight="700" text-anchor="start">No SSH</text>
<rect x="450" y="398" width="300" height="236" rx="12" fill="#e8f4ef" stroke="#237d70"/>
<text x="600" y="432" font-size="22" fill="#237d70" font-weight="700" text-anchor="middle">Development LXC</text>
<rect x="468" y="454" width="264" height="153" rx="12" fill="#ffffff" stroke="#237d70"/>
<text x="600" y="483" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">Screen: game-agent</text>
<rect x="485" y="500" width="230" height="84" rx="12" fill="#eaf4ff" stroke="#2563a5"/>
<text x="600" y="533" font-size="22" fill="#2563a5" font-weight="700" text-anchor="middle">Pi process</text>
<text x="600" y="564" font-size="19" fill="#2563a5" font-weight="400" text-anchor="middle">Keeps running</text>
<text x="600" y="683" font-size="20" fill="#996017" font-weight="700" text-anchor="middle">Ctrl+A, then d</text>
<text x="600" y="724" font-size="17" fill="#526177" font-weight="400" text-anchor="middle">Detach; close SSH or your laptop.</text>
<rect x="820" y="115" width="340" height="647" rx="12" fill="#f8fafc" stroke="#c8d4e3"/>
<text x="844" y="156" font-size="23" fill="#237d70" font-weight="700" text-anchor="start">03</text>
<text x="888" y="156" font-size="25" fill="#172033" font-weight="700" text-anchor="start">Reattached</text>
<rect x="840" y="180" width="300" height="100" rx="12" fill="#eaf4ff" stroke="#2563a5"/>
<text x="990" y="219" font-size="21" fill="#2563a5" font-weight="700" text-anchor="middle">Laptop connected again</text>
<text x="990" y="252" font-size="19" fill="#526177" font-weight="400" text-anchor="middle">Return to the same Pi</text>
<path d="M990 283 L990 389" fill="none" stroke="#2563a5" stroke-width="2" marker-end="url(#blue)"/>
<text x="1009" y="342" font-size="18" fill="#2563a5" font-weight="700" text-anchor="start">SSH</text>
<rect x="840" y="398" width="300" height="236" rx="12" fill="#e8f4ef" stroke="#237d70"/>
<text x="990" y="432" font-size="22" fill="#237d70" font-weight="700" text-anchor="middle">Development LXC</text>
<rect x="858" y="454" width="264" height="153" rx="12" fill="#ffffff" stroke="#237d70"/>
<text x="990" y="483" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">Screen: game-agent</text>
<rect x="875" y="500" width="230" height="84" rx="12" fill="#eaf4ff" stroke="#2563a5"/>
<text x="990" y="533" font-size="22" fill="#2563a5" font-weight="700" text-anchor="middle">Pi process</text>
<text x="990" y="564" font-size="19" fill="#2563a5" font-weight="400" text-anchor="middle">Progress or result</text>
<text x="990" y="683" font-size="20" fill="#2563a5" font-weight="700" text-anchor="middle">screen -r game-agent</text>
<text x="990" y="716" font-size="18" fill="#526177" font-weight="400" text-anchor="middle">Reconnect with SSH,</text>
<text x="990" y="741" font-size="18" fill="#526177" font-weight="400" text-anchor="middle">then reattach.</text>
<path d="M386 538 L424 538" fill="none" stroke="#237d70" stroke-width="2" marker-end="url(#teal)"/>
<path d="M776 538 L814 538" fill="none" stroke="#237d70" stroke-width="2" marker-end="url(#teal)"/>
<rect x="40" y="788" width="1120" height="53" rx="12" fill="#f2edfb" stroke="#c8d4e3"/>
<text x="600" y="822" font-size="21" fill="#7950a7" font-weight="700" text-anchor="middle">The LXC and model connection stay available. Pi may finish or wait for your input.</text>
</g>
</svg>

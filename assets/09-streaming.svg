<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">An answer arriving piece by piece</title><desc id="desc">Qwen streams text through your backend. The browser progressively displays You, You need, then You need three shards.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563a5" stroke-width="1.5"/></marker></defs>
<rect width="760" height="220" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="12" y="55" width="155" height="110" rx="12" fill="#eaf4ff" stroke="#bfd4e8"/><text x="89" y="95" font-size="24" fill="#2563a5" text-anchor="middle" font-weight="700">Qwen</text><text x="89" y="132" font-size="19" fill="#172033" text-anchor="middle">Text pieces</text><path d="M174 110 L222 110" fill="none" stroke="#2563a5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="230" y="55" width="170" height="110" rx="12" fill="#eaf4ff" stroke="#bfd4e8"/><text x="315" y="95" font-size="21" fill="#2563a5" text-anchor="middle" font-weight="700">Your backend</text><text x="315" y="132" font-size="18" fill="#172033" text-anchor="middle">Forwards them</text><path d="M406 110 L454 110" fill="none" stroke="#2563a5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="462" y="14" width="286" height="192" rx="12" fill="#e8f4ef" stroke="#bdd9ce"/><text x="605" y="46" font-size="23" fill="#237d70" text-anchor="middle" font-weight="700">Browser chat</text><rect x="478" y="62" width="62" height="34" rx="8" fill="white" stroke="#bdd9ce"/><text x="489" y="85" font-size="19" fill="#172033" text-anchor="start">You</text><rect x="478" y="104" width="114" height="34" rx="8" fill="white" stroke="#bdd9ce"/><text x="489" y="127" font-size="19" fill="#172033" text-anchor="start">You need</text><rect x="478" y="146" width="252" height="34" rx="8" fill="white" stroke="#bdd9ce"/><text x="489" y="169" font-size="19" fill="#172033" text-anchor="start">You need three shards.</text><text x="206" y="204" font-size="18" fill="#526177" text-anchor="middle">One answer, delivered gradually</text></g></svg>

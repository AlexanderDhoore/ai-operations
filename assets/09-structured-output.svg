<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">From fields to interface</title><desc id="desc">A JSON Schema defines an answer string and suggested questions. Qwen returns structured data. Your interface displays the answer and turns the questions into buttons.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563a5" stroke-width="1.5"/></marker></defs>
<rect width="760" height="220" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="12" y="18" width="242" height="184" rx="12" fill="#eaf4ff" stroke="#bfd4e8"/><text x="133" y="52" font-size="22" fill="#2563a5" text-anchor="middle" font-weight="700">Your JSON Schema</text><text x="30" y="95" font-size="19" fill="#172033" text-anchor="start">answer: string</text><text x="30" y="136" font-size="18" fill="#172033" text-anchor="start">suggested_questions:</text><text x="30" y="167" font-size="18" fill="#526177" text-anchor="start">list of strings</text><text x="358" y="83" font-size="19" fill="#2563a5" text-anchor="middle">Qwen returns</text><text x="358" y="107" font-size="22" fill="#2563a5" text-anchor="middle" font-weight="700">JSON</text><path d="M268 133 L447 133" fill="none" stroke="#2563a5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="462" y="18" width="286" height="184" rx="12" fill="#e8f4ef" stroke="#bdd9ce"/><text x="605" y="52" font-size="22" fill="#237d70" text-anchor="middle" font-weight="700">Your interface</text><rect x="476" y="68" width="258" height="49" rx="8" fill="white" stroke="#bdd9ce"/><text x="605" y="99" font-size="19" fill="#172033" text-anchor="middle">You need three shards.</text><rect x="476" y="135" width="150" height="42" rx="8" fill="#dcebf9" stroke="#bfd4e8"/><text x="551" y="162" font-size="17" fill="#2563a5" text-anchor="middle">Where are they?</text><rect x="634" y="135" width="100" height="42" rx="8" fill="#dcebf9" stroke="#bfd4e8"/><text x="684" y="162" font-size="17" fill="#2563a5" text-anchor="middle">Used up?</text></g></svg>

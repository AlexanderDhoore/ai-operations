<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">From a fresh chat to maintained memory</title><desc id="desc">VS Code includes project instructions. The agent reads MEMORY.md, discusses a plan, works and checks results, then updates memory. A later chat reads the updated file.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526177" stroke-width="1.6"/></marker></defs><rect width="1100" height="880" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="550" y="45" font-size="30" fill="#172033" font-weight="700" text-anchor="middle">From a fresh chat to maintained memory</text><rect x="40" y="90" width="300" height="115" rx="14" fill="#eaf4ff" stroke="#c8d4e3"/><text x="60" y="123" font-size="21" fill="#172033" font-weight="700" text-anchor="start">1. Start a new chat</text><text x="60" y="154" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Same game workspace</text><text x="60" y="181" font-size="18" fill="#526177" font-weight="400" text-anchor="start">No pasted chat history</text><path d="M340 147 H390" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="405" y="80" width="655" height="135" rx="14" fill="#eaf4ff" stroke="#c8d4e3"/><text x="425" y="113" font-size="21" fill="#172033" font-weight="700" text-anchor="start">2. VS Code includes AGENTS.md</text><text x="425" y="144" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Stable instructions: read MEMORY.md at startup,</text><text x="425" y="171" font-size="18" fill="#526177" font-weight="400" text-anchor="start">agree on a plan, and maintain the working record.</text><path d="M730 215 V270" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="405" y="285" width="655" height="140" rx="14" fill="#f2edfb" stroke="#c8d4e3"/><text x="425" y="318" font-size="21" fill="#172033" font-weight="700" text-anchor="start">3. Agent reads MEMORY.md</text><text x="425" y="349" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Current goal, agreed plan, decisions,</text><text x="425" y="376" font-size="18" fill="#526177" font-weight="400" text-anchor="start">progress and checks, next step.</text><rect x="40" y="285" width="300" height="140" rx="14" fill="#f8fafc" stroke="#c8d4e3"/><text x="60" y="318" font-size="21" fill="#172033" font-weight="700" text-anchor="start">Files persist on disk</text><text x="60" y="349" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Reading adds their content</text><text x="60" y="376" font-size="18" fill="#526177" font-weight="400" text-anchor="start">to the new request.</text><path d="M340 355 H392" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M730 425 V482" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610" y="497" width="450" height="135" rx="14" fill="#eaf8f5" stroke="#c8d4e3"/><text x="630" y="530" font-size="21" fill="#172033" font-weight="700" text-anchor="start">4. Discuss, agree, work</text><text x="630" y="561" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Save the plan before implementation.</text><text x="630" y="588" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Take one step and check the result.</text><path d="M610 565 H510" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="497" width="455" height="135" rx="14" fill="#f2edfb" stroke="#c8d4e3"/><text x="60" y="530" font-size="21" fill="#172033" font-weight="700" text-anchor="start">5. Update MEMORY.md</text><text x="60" y="561" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Record actual progress and decisions.</text><text x="60" y="588" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Keep the next step clear and current.</text><path d="M270 497 V453 H560 V425" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><text x="265" y="704" font-size="20" fill="#526177" font-weight="700" text-anchor="middle">Repeat during the work</text><path d="M150 632 V740 H22 V145 H38" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><text x="550" y="783" font-size="21" fill="#172033" font-weight="400" text-anchor="middle">The next chat follows the same startup path and reads the updated memory.</text><text x="550" y="832" font-size="21" fill="#172033" font-weight="700" text-anchor="middle">AGENTS.md: how we collaborate.     MEMORY.md: where the work stands.</text></g></svg>
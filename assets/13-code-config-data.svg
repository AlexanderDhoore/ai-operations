<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Replace code, preserve the data you need</title>
  <desc id="desc">The runner checkout contains replaceable source code and build instructions. Compose builds images from that code and receives configuration through Actions secrets and variables. If the game needs persistent files, containers mount either named Docker volumes or stable host directories outside the checkout. Games without persistent data need neither.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526177" stroke-width="1.7"/></marker></defs>
  <rect width="1200" height="490" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="600" y="40" text-anchor="middle" font-size="30" font-weight="700">Replace code, preserve the data you need</text>
    <text x="600" y="77" text-anchor="middle" font-size="21" fill="#526177">A checkout is a build workspace, not permanent application storage.</text>
    <rect x="24" y="120" width="350" height="140" rx="12" fill="#eaf4ff" stroke="#2563a5"/>
    <text x="199" y="159" text-anchor="middle" font-size="25" font-weight="700" fill="#2563a5">Runner checkout</text>
    <text x="199" y="200" text-anchor="middle" font-size="22">Code + Dockerfiles + Compose</text>
    <text x="199" y="236" text-anchor="middle" font-size="22">May be cleaned or replaced</text>
    <path d="M378 190 H481" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="430" y="169" text-anchor="middle" font-size="20" fill="#526177">build</text>
    <rect x="497" y="120" width="310" height="140" rx="12" fill="#e8f4ef" stroke="#237d70"/>
    <text x="652" y="159" text-anchor="middle" font-size="25" font-weight="700" fill="#237d70">Game containers</text>
    <text x="652" y="200" text-anchor="middle" font-size="22">Run the built images</text>
    <text x="652" y="236" text-anchor="middle" font-size="22">Read runtime configuration</text>
    <rect x="903" y="120" width="273" height="140" rx="12" fill="#fff6df" stroke="#b28126"/>
    <text x="1039" y="159" text-anchor="middle" font-size="25" font-weight="700">Configuration</text>
    <text x="1039" y="200" text-anchor="middle" font-size="22">Actions secrets</text>
    <text x="1039" y="236" text-anchor="middle" font-size="22">and variables</text>
    <path d="M899 190 H814" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="855" y="169" text-anchor="middle" font-size="20" fill="#526177">supply</text>
    <path d="M652 266 V312" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="670" y="296" font-size="20" fill="#526177">mount if needed</text>
    <rect x="274" y="326" width="756" height="104" rx="12" fill="#f8fafc" stroke="#9eb2c9"/>
    <text x="652" y="362" text-anchor="middle" font-size="24" font-weight="700">Persistent data, outside the checkout</text>
    <text x="652" y="402" text-anchor="middle" font-size="22">Named Docker volume OR stable host directory with a bind mount</text>
    <text x="600" y="468" text-anchor="middle" font-size="21" fill="#526177">No saved data? No persistent storage required.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc"><title id="title">Context grows. Compaction makes room.</title><desc id="desc">Request sources become tokens. Three context bars show early history, growing history, and a shorter summary after compaction. Some details may be omitted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526177" stroke-width="1.6"/></marker></defs><rect width="1100" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="550" y="45" font-size="30" fill="#172033" font-weight="700" text-anchor="middle">Context grows. Compaction makes room.</text><rect x="40" y="80" width="550" height="150" rx="14" fill="#eaf4ff" stroke="#c8d4e3"/><text x="60" y="113" font-size="21" fill="#172033" font-weight="700" text-anchor="start">VS Code assembles each request</text><text x="60" y="144" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Instructions and available tools</text><text x="60" y="171" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Your messages, replies, file reads and tool results</text><path d="M590 155 H635" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="100" width="410" height="110" rx="14" fill="#f2edfb" stroke="#c8d4e3"/><text x="670" y="133" font-size="21" fill="#172033" font-weight="700" text-anchor="start">Model tokenizer</text><text x="670" y="164" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Text becomes a sequence of token IDs.</text><text x="40" y="276" font-size="24" fill="#172033" font-weight="700" text-anchor="start">One finite context budget</text><text x="40" y="308" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Illustrative proportions, not measured token counts.</text><text x="40" y="355" font-size="22" fill="#172033" font-weight="700" text-anchor="start">1. Early in the conversation</text><rect x="40" y="373" width="240" height="66" fill="#d9eaff" stroke="white" stroke-width="2"/><text x="160.0" y="413" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Instructions + tools</text><rect x="280" y="373" width="200" height="66" fill="#dcefe9" stroke="white" stroke-width="2"/><text x="380.0" y="413" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Short history</text><rect x="480" y="373" width="0" height="66" fill="#e3d7f4" stroke="white" stroke-width="2"/><rect x="480" y="373" width="360" height="66" fill="#f8fafc" stroke="white" stroke-width="2"/><text x="660.0" y="413" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Room to grow</text><rect x="840" y="373" width="220" height="66" fill="#fff0cf" stroke="white" stroke-width="2"/><text x="950.0" y="413" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Response reserve</text><text x="40" y="492" font-size="22" fill="#172033" font-weight="700" text-anchor="start">2. More work adds messages and tool results</text><rect x="40" y="510" width="240" height="66" fill="#d9eaff" stroke="white" stroke-width="2"/><text x="160.0" y="550" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Instructions + tools</text><rect x="280" y="510" width="500" height="66" fill="#dcefe9" stroke="white" stroke-width="2"/><text x="530.0" y="550" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Detailed history</text><rect x="780" y="510" width="0" height="66" fill="#e3d7f4" stroke="white" stroke-width="2"/><rect x="780" y="510" width="60" height="66" fill="#f8fafc" stroke="white" stroke-width="2"/><rect x="840" y="510" width="220" height="66" fill="#fff0cf" stroke="white" stroke-width="2"/><text x="950.0" y="550" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Response reserve</text><path d="M550 587 V624" fill="none" stroke="#526177" stroke-width="2.5" marker-end="url(#arrow)"/><text x="578" y="613" font-size="18" fill="#526177" font-weight="400" text-anchor="start">Agent summarizes older history</text><text x="40" y="670" font-size="22" fill="#172033" font-weight="700" text-anchor="start">3. After compaction</text><rect x="40" y="688" width="240" height="66" fill="#d9eaff" stroke="white" stroke-width="2"/><text x="160.0" y="728" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Instructions + tools</text><rect x="280" y="688" width="140" height="66" fill="#dcefe9" stroke="white" stroke-width="2"/><text x="350.0" y="728" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Recent turns</text><rect x="420" y="688" width="170" height="66" fill="#e3d7f4" stroke="white" stroke-width="2"/><text x="505.0" y="728" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Summary</text><rect x="590" y="688" width="250" height="66" fill="#f8fafc" stroke="white" stroke-width="2"/><text x="715.0" y="728" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Room to grow</text><rect x="840" y="688" width="220" height="66" fill="#fff0cf" stroke="white" stroke-width="2"/><text x="950.0" y="728" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">Response reserve</text><text x="550" y="824" font-size="21" fill="#172033" font-weight="400" text-anchor="middle">A summary can omit details. Files preserve a record the agent can read again.</text><text x="550" y="860" font-size="18" fill="#526177" font-weight="400" text-anchor="middle">Compaction changes request context. It does not update your memory files for you.</text></g></svg>
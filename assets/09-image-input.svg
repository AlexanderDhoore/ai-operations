<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">A picture becomes part of the question</title><desc id="desc">A picture and a question are supplied together to Qwen. The answer describes the mountains and sun visible in the supplied image.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563a5" stroke-width="1.5"/></marker></defs>
<rect width="760" height="220" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="12" y="18" width="272" height="184" rx="12" fill="#eaf4ff" stroke="#bfd4e8"/><text x="148" y="48" font-size="21" fill="#2563a5" text-anchor="middle" font-weight="700">Screenshot + question</text><rect x="27" y="62" width="112" height="92" rx="6" fill="#e8f4ef" stroke="#bdd9ce"/><path d="M42 133 L68 100 L84 116 L101 94 L126 133 Z" fill="#9dcdba"/><circle cx="52" cy="83" r="9" fill="#f0c65b"/><rect x="154" y="72" width="110" height="68" rx="8" fill="white" stroke="#bfd4e8"/><text x="209" y="99" font-size="18" fill="#172033" text-anchor="middle">What can</text><text x="209" y="125" font-size="18" fill="#172033" text-anchor="middle">you see?</text><text x="148" y="184" font-size="18" fill="#526177" text-anchor="middle">One user message</text><path d="M293 110 L337 110" fill="none" stroke="#2563a5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="347" y="67" width="119" height="86" rx="12" fill="#eaf4ff" stroke="#bfd4e8"/><text x="406" y="119" font-size="24" fill="#2563a5" text-anchor="middle" font-weight="700">Qwen</text><path d="M474 110 L518 110" fill="none" stroke="#2563a5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="18" width="218" height="184" rx="12" fill="#e8f4ef" stroke="#bdd9ce"/><text x="639" y="51" font-size="23" fill="#237d70" text-anchor="middle" font-weight="700">Answer</text><text x="639" y="96" font-size="20" fill="#172033" text-anchor="middle">“I can see</text><text x="639" y="127" font-size="20" fill="#172033" text-anchor="middle">mountains and</text><text x="639" y="158" font-size="20" fill="#172033" text-anchor="middle">a sun.”</text></g></svg>
